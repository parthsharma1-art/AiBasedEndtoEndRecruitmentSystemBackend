<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer confirmed</title>
</head>

<body
  style="margin:0;padding:0;background:#f4f4f5;-webkit-font-smoothing:antialiased;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <span style="display:none!important;opacity:0;height:0;width:0;">{{companyName}} — your application status</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
          style="max-width:480px;background:#ffffff;border-radius:16px;border:1px solid #e4e4e7;box-shadow:0 1px 3px rgba(0,0,0,.06);">
          <tr>
            <td style="height:4px;background:#10b981;border-radius:16px 16px 0 0;line-height:4px;font-size:0;">&nbsp;
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle;padding-right:10px;">
                    <img src="https://ik.imagekit.io/xuh3db9z6/Gemini_Generated_Image_xo17kvxo17kvxo17.png" width="32"
                      height="32" alt="" style="border-radius:8px;display:block;">
                  </td>
                  <td
                    style="vertical-align:middle;font-size:13px;font-weight:600;color:#18181b;letter-spacing:-0.02em;">
                    Recruitment</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 24px;">
              <p
                style="margin:0 0 6px;font-size:11px;font-weight:600;color:#10b981;text-transform:uppercase;letter-spacing:.06em;">
                Offer</p>
              <h1
                style="margin:0;font-size:22px;font-weight:600;color:#18181b;letter-spacing:-0.03em;line-height:1.25;">
                You're hired, {{candidateName}}</h1>
              <p style="margin:12px 0 0;font-size:15px;color:#52525b;line-height:1.5;">{{companyName}} has marked your
                application as <strong style="color:#18181b;">hired</strong>.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 20px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                style="background:#fafafa;border-radius:10px;border:1px solid #f4f4f5;">
                <tr>
                  <td style="padding:14px 16px;border-bottom:1px solid #f4f4f5;">
                    <p
                      style="margin:0 0 2px;font-size:11px;font-weight:500;color:#a1a1aa;text-transform:uppercase;letter-spacing:.04em;">
                      Role</p>
                    <p style="margin:0;font-size:14px;font-weight:500;color:#18181b;">{{jobTitle}}</p>
                  </td>
                </tr>
                <tr>
                  <td style="padding:14px 16px;">
                    <p
                      style="margin:0 0 2px;font-size:11px;font-weight:500;color:#a1a1aa;text-transform:uppercase;letter-spacing:.04em;">
                      Company</p>
                    <p style="margin:0;font-size:14px;font-weight:500;color:#18181b;">{{companyName}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 24px;">
              {{messageSection}}
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="padding-top:4px;">
                    <a href="{{dashboardUrl}}"
                      style="display:inline-block;width:100%;max-width:100%;box-sizing:border-box;text-align:center;background:#18181b;color:#fafafa!important;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:10px;">Open
                      dashboard</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 24px;border-top:1px solid #f4f4f5;">
                <p style="margin:20px 0 0;font-size:12px;color:#121215;line-height:1.5;text-align:center;"><br><span style="color:#121215;">© 2026 AI Based End to End Recruitment System</span></p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
