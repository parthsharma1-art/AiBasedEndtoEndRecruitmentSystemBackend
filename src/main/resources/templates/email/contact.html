<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
</head>

<body style="margin:0;padding:0;background:#f1f5f9;font-family:Segoe UI,Roboto,Arial,sans-serif;">

  <!-- Hidden Preview -->
  <span style="display:none!important;opacity:0;">
    New contact form message
  </span>

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:30px 15px;">
    <tr>
      <td align="center">

        <!-- Main Card -->
        <table width="100%" cellpadding="0" cellspacing="0"
          style="max-width:580px;background:#ffffff;border-radius:14px;border:1px solid #e2e8f0;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:20px;border-bottom:1px solid #e2e8f0;">
              <table width="100%">
                <tr>

                  <td>
                    <table>
                      <tr>
                        <td style="width:36px;vertical-align:middle;">
                          <div style="width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#0284c7,#0369a1);"></div>
                        </td>
                        <td style="padding-left:8px;font-weight:600;color:#0f172a;">
                          AI Based End to End Recruitment System
                        </td>
                      </tr>
                    </table>
                  </td>

                  <td align="right">
                    <span style="background:#e0f2fe;color:#0284c7;font-size:12px;padding:6px 10px;border-radius:20px;">
                      New Message
                    </span>
                  </td>

                </tr>
              </table>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td style="padding:20px 24px 10px;">
              <h1 style="margin:0;font-size:20px;color:#0f172a;">
                New Contact Submission
              </h1>
            </td>
          </tr>

          <!-- From -->
          <tr>
            <td style="padding:10px 24px;">
              <p style="font-size:12px;color:#64748b;margin-bottom:5px;text-transform:uppercase;">From</p>
              <p style="margin:0;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
                {{email}}
              </p>
            </td>
          </tr>

          <!-- Source -->
          <tr>
            <td style="padding:10px 24px;">
              <p style="font-size:12px;color:#64748b;margin-bottom:5px;text-transform:uppercase;">Source</p>
              <p style="margin:0;padding:10px;background:#f1f5f9;border-radius:8px;font-weight:600;">
                {{source}}
              </p>
            </td>
          </tr>

          <!-- Message -->
          <tr>
            <td style="padding:10px 24px 20px;">
              <p style="font-size:12px;color:#64748b;margin-bottom:5px;text-transform:uppercase;">Message</p>
              <p
                style="margin:0;padding:14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;line-height:1.6;">
                {{message}}
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 24px;">
              <hr style="border:none;border-top:1px solid #e2e8f0;">
            </td>
          </tr>

          <!-- Social (SendGrid CDN icons) -->
          <tr>
            <td align="center" style="padding:18px;">
              <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"
                style="margin:0 8px;display:inline-block;text-decoration:none;">
                <img src="https://cdn.mcauto-images-production.sendgrid.net/6df2115130b4edb8/8e145d4a-6e84-4b8f-a01e-e5440bb571d4/28x28.png"
                  width="28" height="28" alt="LinkedIn" style="display:block;border:0;">
              </a>
              <a href="https://x.com/" target="_blank" rel="noopener noreferrer"
                style="margin:0 8px;display:inline-block;text-decoration:none;">
                <img src="https://cdn.mcauto-images-production.sendgrid.net/6df2115130b4edb8/48687cf9-b61e-41d9-af8c-a0353ced3dda/26x26.png"
                  width="26" height="26" alt="X" style="display:block;border:0;">
              </a>
              <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer"
                style="margin:0 8px;display:inline-block;text-decoration:none;">
                <img src="https://cdn.mcauto-images-production.sendgrid.net/6df2115130b4edb8/c5a5cb22-2ded-4f2e-be88-d841fb16ac12/28x28.png"
                  width="28" height="28" alt="Instagram" style="display:block;border:0;">
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 24px;text-align:center;">



              <p style="margin:6px 0 0;font-size:12px;color:#94a3b8;">
                © 2026 AI Based End to End Recruitment System
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>

</html>
