spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: aibasedendtoendsystem
    redis:
      # Upstash TCP endpoint (TLS). Render env REDIS_URL must be the rediss:// URL, NOT the https:// REST URL.
      url: ${REDIS_URL:rediss://default:gQAAAAAAAlF9AAIgcDI3NTkwMDRkNmE0NDA0YThjYjIwMzY4Yzc3MjgzOTE2Yw@modest-wombat-151933.upstash.io:6379}
      ssl:
        enabled: true
      timeout: 5s
      connect-timeout: 5s
  cache:
    type: redis

# Upstash REST (HTTP) endpoint. Used only by RedisConfig.set/get (TestController).
UPSTASH_REDIS_REST_URL: ${REDIS_REST_URL:https://modest-wombat-151933.upstash.io}
UPSTASH_REDIS_REST_TOKEN: ${REDIS_REST_TOKEN:gQAAAAAAAlF9AAIgcDI3NTkwMDRkNmE0NDA0YThjYjIwMzY4Yzc3MjgzOTE2Yw}

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8081
  servlet:
    context-path: /api
app:
  auth:
    otp:
      ttl-minutes: 10
      # Single Render dyno: OTP works if Redis is down. Set false when REDIS_URL is correct (rediss://) or you scale horizontally.
      memory-fallback-when-redis-unavailable: ${OTP_MEMORY_FALLBACK:true}
  oauth2:
    client:
      registration:
        google:
          provider: google
          client-id: 933277047426-lc7eeb96h30umrm6qfoncp6l27026s07.apps.googleusercontent.com
          client-secret: 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
          redirectUriForRecruiter: https://aibasedendtoendrecruitmentsystembackend.onrender.com/api/recruiter/google/login
          redirectUriForCandidate: https://aibasedendtoendrecruitmentsystembackend.onrender.com/api/candidate/google/login

